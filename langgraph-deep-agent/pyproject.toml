[project]
name = "langgraph-deep-agent-experiment"
version = "0.1.0"
description = "Agent framework 實驗與教學"
requires-python = ">=3.13,<3.14"
dependencies = ['deepagents==0.7.32', 'langchain-openai==1.7.3', 'fastapi>=0.115,<1', 'uvicorn>=0.34,<1', 'python-dotenv>=1.1,<2']

[dependency-groups]
dev = ["pytest>=8,<10", "httpx>=0.28,<1", "httpx2>=2,<3", "ruff>=0.15,<1", "nbformat>=5,<6", "nbclient>=0.10,<1"]
notebook = ["jupyterlab>=4,<5", "ipykernel>=6,<8"]

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
target-version = "py313"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B"]
