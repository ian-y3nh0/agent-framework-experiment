name: langgraph-agent-experiment
services:
  agent:
    build:
      context: .
      dockerfile: docker/Dockerfile
    env_file:
      - path: ../.env
        required: false
      - path: .env
        required: false
    environment:
      AGENT_IN_DOCKER: "1"
    ports:
      - "127.0.0.1:8001:8000"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    init: true
    healthcheck:
      test: ["CMD", "/app/.venv/bin/python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 15s
